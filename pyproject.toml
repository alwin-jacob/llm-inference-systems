[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "llm-inference-systems"
version = "0.2.0"
description = "Stage 0 measurement contracts for synthetic LLM-serving fixtures"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Alwin Jacob" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx==0.28.1", "pydantic==2.13.4"]

[project.scripts]
llm-inference = "llm_inference_systems.cli:main"

[dependency-groups]
dev = [
  "hatchling==1.32.0",
  "jsonschema==4.26.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_inference_systems"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ARG", "B", "C4", "DTZ", "E", "F", "I", "PERF", "PT", "PTH", "RUF", "SIM", "UP", "W"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "PT011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
